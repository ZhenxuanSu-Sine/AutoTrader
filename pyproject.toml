[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrader-cn"
version = "0.1.0"
description = "A research-first quantitative investment framework for Chinese markets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
]

[project.optional-dependencies]
data = ["akshare>=1.14", "pyarrow>=15", "tushare>=1.4"]
dev = ["pytest>=8", "ruff>=0.5"]
legacy = ["backtrader>=1.9.78"]

[tool.setuptools.packages.find]
include = ["autotrader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
